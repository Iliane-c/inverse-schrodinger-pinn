[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "invpinn"
version = "0.1.0"
description = "Recovering quantum potentials from measured densities with physics-informed neural networks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "torch>=2.0", "matplotlib>=3.6", "pandas>=1.5", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "experiments"]
testpaths = ["tests"]
